  - Terminals
  - Assets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.flowbirdhub.com/
  endpointsModeled: true
  properties:
  - url: https://docs.flowbirdhub.com/
    type: Documentation
  - url: https://www.flowbird.com/our-solutions/parking-solutions/open-platform-for-parking-and-e-mobility/
    type: Documentation
  description: Retrieve the inventory, configuration, health/status, and collection
    (coin, card, and cash) data for Flowbird pay stations and terminals managed by
    the central platform. Endpoints are modeled from Flowbird HUB asset-management
    descriptions; the documented live API is certificate-secured and access-scoped
    per contract.
- aid: flowbird:flowbird-hub-transactions-api
  name: Flowbird HUB Transactions API
  tags:
  - Transaction
  - Payments
  - Reporting
  tags_raw:
  - Transactions
  - Payments
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.flowbirdhub.com/
  endpointsModeled: true
  properties:
  - url: https://docs.flowbirdhub.com/
    type: Documentation
  - url: https://www.flowbird.com/our-solutions/parking-solutions/open-platform-for-parking-and-e-mobility/
    type: Documentation
  description: Read parking and mobility payment transactions and revenue/reporting
    data across channels for reconciliation and analytics, with role-based access
    and ownership filters. Endpoints are modeled from Flowbird HUB reporting/export
    descriptions; the live API is OAuth2/certificate secured and granted under
    contract, with bulk export also available via Flowbird's service desk.

