name: Flowbird

kind: company

description: Flowbird is a global urban mobility and parking technology company that
  builds pay stations, mobile parking apps, digital permits, EV charging, and transit
  ticketing systems for cities and transport authorities worldwide. Flowbird was
  acquired by EasyPark Group in an acquisition that closed in January 2025. Its
  integration surface is the Flowbird HUB, an open platform that exposes documented
  but partner/agency-gated APIs (OAuth2 and client-certificate secured, with
  role-based access control and ownership filters) for tariffs, rights/permits,
  parking sessions, pay stations, and transactions. There is no self-service public
  sign-up; access is granted to cities, transport agencies, and integration partners
  under contract.

