    type: Documentation
  - url: https://www.flowbird.com/our-solutions/parking-solutions/open-platform-for-parking-and-e-mobility/
    type: Documentation
  description: Start, stop, extend, and query active and historical parking sessions
    across pay-station, mobile-app, and permit channels, and expose real-time
    session state to enforcement and occupancy consumers. Endpoints are modeled from
    Flowbird HUB platform descriptions; the live reference at docs.flowbirdhub.com
    is OAuth2/certificate secured and access is granted to cities and partners under
    contract.
- aid: flowbird:flowbird-hub-tariffs-rights-api
  name: Flowbird HUB Tariffs and Rights API
  tags:
  - Tariffs
  - Rights
  - Permits
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.flowbirdhub.com/
  endpointsModeled: true
  properties:
  - url: https://docs.flowbirdhub.com/
    type: Documentation
  - url: https://www.flowbird.com/our-solutions/parking-solutions/open-platform-for-parking-and-e-mobility/
    type: Documentation
  description: Configure and read parking tariffs, pricing rules, and rights (digital
    permits, subscriptions, and eligibility) consistently across every sales channel.
    Flowbird documents that tariffs and rights can be managed either through the HUB
    user interface or via the API; endpoints here are modeled from that platform
    description and the live surface is partner/agency-gated.
- aid: flowbird:flowbird-hub-pay-stations-api
