apis:
- aid: flowbird:flowbird-hub-parking-sessions-api
  name: Flowbird HUB Parking Sessions API
  tags:
  - Parking Sessions
  - Mobile Parking
  - Enforcement
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
